<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AudioMark - 音频书签播放器</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f5f5f7;--bg2:#fff;--bg3:#e8e8ed;
    --accent:#007aff;--accent2:#5856d6;
    --text:#1d1d1f;--text2:#86868b;--text3:#aeaeb2;
    --border:#d2d2d7;--card:#fff;--hover:#f0f0f5;
    --radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.04);
    --font:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;
    --mono:'SF Mono','Menlo','Consolas',monospace;
  }
  html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;overflow:hidden}

  /* Header */
  .header{display:flex;align-items:center;gap:12px;padding:0 20px;height:52px;background:rgba(255,255,255,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);flex-shrink:0}
  .header h1{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--text);white-space:nowrap}
  .header h1 span{color:var(--text2);font-weight:400;font-size:12px;margin-left:6px}
  #folder-btn{display:none}
  .current-file{color:var(--text2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;padding-left:8px}
  #settings-btn{background:none;border:none;color:var(--text2);cursor:pointer;padding:6px;border-radius:6px;transition:all .15s;display:flex;align-items:center}
  #settings-btn:hover{background:var(--hover);color:var(--text)}

  /* Main Layout */
  .main{display:flex;flex:1;overflow:hidden}

  /* Sidebar - File Tree */
  .sidebar{width:240px;min-width:200px;background:rgba(255,255,255,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
  .sidebar-header{padding:12px 16px;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border)}
  .file-tree{flex:1;overflow-y:auto;padding:4px 0}
  .file-tree::-webkit-scrollbar{width:6px}
  .file-tree::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .tree-item{display:flex;align-items:center;padding:6px 16px;cursor:pointer;transition:background .15s;user-select:none;gap:6px;font-size:13px}
  .tree-item:hover{background:var(--hover)}
  .tree-item.active{background:var(--accent);color:#fff}
  .tree-item.folder{color:var(--text2)}
  .tree-item .icon{width:16px;text-align:center;flex-shrink:0;font-size:14px}
  .tree-item .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tree-folder .icon{color:var(--text3)}
  .tree-audio .icon{color:var(--accent)}

  /* Player Area */
  .player-area{flex:1;display:flex;flex-direction:column;padding:32px;overflow-y:auto;gap:24px}

  /* Now Playing */
  .now-playing{text-align:center;padding:16px 0 8px}
  .now-playing .title{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px}
  .now-playing .subtitle{font-size:13px;color:var(--text2);font-weight:400}

  /* Progress Bar */
  .progress-container{background:var(--card);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow)}
  .time-display{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:8px;font-family:var(--mono);font-weight:400}
  .progress-bar-wrap{position:relative;height:32px;display:flex;align-items:center;cursor:pointer}
  .progress-bar{width:100%;height:4px;background:var(--bg3);border-radius:2px;position:relative;overflow:visible}
  .progress-fill{height:100%;background:var(--accent);border-radius:2px;width:0%;transition:width .1s linear;position:relative}
  .progress-fill::after{content:'';position:absolute;right:-5px;top:50%;transform:translateY(-50%);width:10px;height:10px;background:#fff;border:2px solid var(--accent);border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.15);opacity:0;transition:opacity .15s}
  .progress-bar-wrap:hover .progress-fill::after{opacity:1}
  .bookmark-marker{position:absolute;top:50%;transform:translate(-50%,-50%);width:8px;height:8px;background:var(--accent2);border:2px solid #fff;border-radius:50%;z-index:2;cursor:pointer;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .bookmark-marker:hover{transform:translate(-50%,-50%) scale(1.4)}

  /* Controls */
  .controls{display:flex;justify-content:center;align-items:center;gap:16px;padding:8px 0;flex-wrap:wrap}
  .ctrl-btn{background:none;border:none;color:var(--text);width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
  .ctrl-btn:hover{background:var(--hover)}
  .ctrl-btn.primary{width:52px;height:52px;background:var(--accent);color:#fff}
  .ctrl-btn.primary:hover{background:#0066d6}
  .ctrl-btn svg{display:block}

  /* Speed Controls */
  .speed-group{display:flex;align-items:center;gap:4px;margin-left:24px;background:var(--bg3);border-radius:8px;padding:3px}
  .speed-btn{background:none;border:none;color:var(--text2);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;font-family:var(--font)}
  .speed-btn:hover{color:var(--text)}
  .speed-btn.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}

  /* Bookmarks Section */
  .bookmarks-section{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
  .bookmarks-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .bookmarks-header h3{font-size:15px;font-weight:600;letter-spacing:-.01em}
  #add-bookmark{background:var(--accent);color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;transition:all .2s;display:flex;align-items:center;gap:5px;font-family:var(--font)}
  #add-bookmark:hover{background:#0066d6}
  .bookmarks-list{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
  .bookmarks-list::-webkit-scrollbar{width:6px}
  .bookmarks-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .bookmark-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;transition:border-color .15s}
  .bookmark-card:hover{border-color:var(--accent)}
  .bookmark-card .time{font-family:var(--mono);font-size:14px;color:var(--accent);font-weight:600;cursor:pointer}
  .bookmark-card .time:hover{text-decoration:underline}
  .bookmark-card .note-area{width:100%;margin-top:8px;background:#fff;border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-size:13px;resize:vertical;min-height:36px;font-family:var(--font);line-height:1.5}
  .bookmark-card .note-area:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,122,255,.12)}
  .bookmark-card .actions{display:flex;justify-content:flex-end;gap:4px;margin-top:8px}
  .bookmark-card .actions button{background:none;border:none;color:var(--text2);cursor:pointer;font-size:12px;padding:4px 8px;border-radius:4px;transition:all .15s;font-family:var(--font)}
  .bookmark-card .actions button:hover{background:var(--hover);color:var(--text)}
  .bookmark-card .actions .del:hover{color:#ff3b30}
  .no-bookmarks{text-align:center;color:var(--text3);padding:16px;font-size:13px}

  /* Save/Export */
  .save-bar{display:flex;justify-content:flex-end;gap:8px;padding:12px 0 0}
  .save-btn{background:none;color:var(--accent);border:1px solid var(--accent);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;transition:all .2s;font-family:var(--font)}
  .save-btn:hover{background:var(--accent);color:#fff}

  /* Empty State */
  .empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text3);gap:12px;text-align:center;padding:40px}
  .empty-state svg{opacity:.2}
  .empty-state p{font-size:15px;font-weight:500}
  .empty-state .hint{font-size:13px;color:var(--text3);font-weight:400}

  /* Toast */
  .toast{position:fixed;bottom:24px;right:24px;background:rgba(29,29,31,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);transform:translateY(100px);opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);z-index:100;font-size:13px;font-weight:500}
  .toast.show{transform:translateY(0);opacity:1}
  .toast.success{border-left:3px solid #34c759}
  .toast.info{border-left:3px solid var(--accent)}

  /* Responsive */
  @media(max-width:768px){
    .sidebar{width:200px;min-width:160px}
    .controls{gap:12px}
    .speed-group{margin-left:0}
  }
</style>
</head>
<body>

<div class="header">
  <h1>AudioMark <span>音频书签播放器</span></h1>
  <button id="settings-btn" title="设置">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
  <div class="current-file" id="current-file">加载中...</div>
</div>

<!-- Settings Modal -->
<div id="settings-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center">
  <div style="background:var(--bg2);border-radius:14px;width:420px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.2);overflow:hidden">
    <div style="padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
      <h3 style="font-size:16px;font-weight:600">设置</h3>
      <button id="close-settings" style="background:none;border:none;color:var(--text2);cursor:pointer;padding:4px;font-size:18px;line-height:1">✕</button>
    </div>
    <div style="padding:20px">
      <label style="display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:6px">音频文件夹路径</label>
      <input type="text" id="cfg-audio-dir" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--bg);color:var(--text);font-family:var(--mono);margin-bottom:20px;box-sizing:border-box">
      <button id="save-config" style="width:100%;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font)">保存并重新加载</button>
      <p style="font-size:12px;color:var(--text3);margin-top:12px;text-align:center">书签 JSON 文件自动保存在音频文件同目录下</p>
    </div>
  </div>
</div>

<div class="main">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">文件列表</div>
    <div class="file-tree" id="file-tree">
      <div class="empty-state" style="padding:30px 16px">
        <p>正在加载...</p>
      </div>
    </div>
  </div>

  <!-- Player -->
  <div class="player-area" id="player-area">
    <div class="empty-state" id="empty-state">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor"/></svg>
      <p>正在加载音频...</p>
    </div>

    <div id="player-content" style="display:none">
      <div class="now-playing">
        <div class="title" id="track-title">-</div>
        <div class="subtitle" id="track-path">-</div>
      </div>

      <!-- Progress -->
      <div class="progress-container">
        <div class="time-display">
          <span id="time-current">00:00</span>
          <span id="time-total">00:00</span>
        </div>
        <div class="progress-bar-wrap" id="progress-wrap">
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button class="ctrl-btn" id="btn-prev" title="后退10秒">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
        </button>
        <button class="ctrl-btn primary" id="btn-play" title="播放/暂停">
          <svg id="icon-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
          <svg id="icon-pause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-next" title="前进10秒">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
        </button>
        <div class="speed-group">
          <button class="speed-btn" data-speed="0.5">0.5×</button>
          <button class="speed-btn" data-speed="0.75">0.75×</button>
          <button class="speed-btn active" data-speed="1">1×</button>
          <button class="speed-btn" data-speed="1.5">1.5×</button>
          <button class="speed-btn" data-speed="2">2×</button>
        </div>
      </div>

      <!-- Bookmarks -->
      <div class="bookmarks-section">
        <div class="bookmarks-header">
          <h3>书签 (<span id="bookmark-count">0</span>)</h3>
          <button id="add-bookmark">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            添加书签
          </button>
        </div>
        <div class="bookmarks-list" id="bookmarks-list">
          <div class="no-bookmarks">暂无书签，点击按钮添加</div>
        </div>
        <div class="save-bar">
          <button class="save-btn" id="save-bookmarks">保存书签</button>
          <button class="save-btn" id="load-bookmarks">重新加载书签</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<audio id="audio" preload="auto"></audio>

<!-- Core -->
<script src="/js/utils/time.js"></script>
<script src="/js/utils/dom.js"></script>
<script src="/js/core/eventBus.js"></script>
<script src="/js/core/moduleRegistry.js"></script>
<script src="/js/core/app.js"></script>

<!-- Modules (order matters: dependencies first) -->
<script src="/js/modules/player/index.js"></script>
<script src="/js/modules/file-tree/index.js"></script>
<script src="/js/modules/bookmarks/index.js"></script>
<script src="/js/modules/settings/index.js"></script>

<!-- Bootstrap -->
<script src="/js/app-boot.js"></script>
</body>
</html>
